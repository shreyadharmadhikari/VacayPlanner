<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Vacation Planner</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Electrolize&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Italianno&family=Leckerli+One&family=Lobster&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Pacifico&family=Pattaya&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="explore.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <h1>VacayPlanner</h1>
        <ul class="hide" id="navLinks" aria-expanded="false">
          <li><a href="#home">Home</a></li>
          <li><a href="#explore">Explore</a></li>
          <li><a href="#favorites">Favorites</a></li>
        </ul>
        <button id="theme-btn">☀︎</button>
        <ul id="theme-menu" class="hidden">
          <li>Dark</li>
          <li>Light</li>
        </ul>

        <span id="menu-icon">☰</span>
      </nav>
    </header>
    <main>
      <section id="home">
        <section class="hero">
          <h1 aria-current="page">Dream Vacation Planner</h1>
          <p>
            Plan your perfect trip with ease — discover destinations, set your
            budget, and explore smarter.
          </p>
        </section>
        <section
          class="searchDestination"
          aria-details="searchHead"
          id="dest-search-and-card"
        >
          <h2 aria-describedby="searchDest" id="searchHead">
            Search your next Travel Destination
          </h2>
          <form
            aria-roledescription="Take user input country to search travel information"
            id="dest-search-form"
          >
            <div class="searchBox-container">
              <input
                type="text"
                id="searchDest"
                placeholder="Where to?"
                list="destinationsList"
                required
              />

              <span id="searchEmoji">🔍︎</span>

              <div class="search-btn-container">
                <button id="search-btn" type="submit">Let's Go!</button>
              </div>
            </div>
          </form>
          <section id="search-result-outer-container">
            <div id="loading"></div>
            <section class="searchResult" id="searchResult">
              <h2 id="vacayHead">
                ✈️ Vacay Destination: <span id="place-name"></span>
              </h2>
              <section id="dest-result-container">
                <div id="dest-result-hero">
                  <div id="dest-result-info-wrapper">
                    <div id="dest-result-info"></div>
                  </div>
                </div>
                <div class="dest-point"></div>
                <div class="dest-point"></div>
                <div class="dest-point"></div>
                <div class="dest-point"></div>
                <div class="dest-point"></div>
                <div class="dest-point"></div>
              </section>
            </section>
            <div id="error"></div>
          </section>
        </section>
      </section>
      <section id="explore" class="explore-section">
        <div class="explore-container">
          <div class="explore-header">
            <h1>Featured Destinations</h1>
            <div class="header-line"></div>
          </div>
          <div class="explore-grid" id="exploreGrid"></div>
        </div>
        <section id="exploreItinerarySection" class="explore-itinerary-section">
          <div id="itineraryResult" class="itinerary-display-area"></div>

          <div
            id="itineraryControls"
            style="display: none; text-align: center; padding-bottom: 3rem"
          >
            <button onclick="clearItinerary()" class="secondary-btn">
              Close Itinerary
            </button>
          </div>
        </section>
      </section>
      <section id="favorites"></section>
      <section id="itinerary" class="hidden">
        <div id="vertical-line"></div>
        <header class="navbar-itinerary">
          <button id="back-btn">Back</button>
          <div>
            <p id="tripDays"></p>
            <p id="placeName"></p>
          </div>
          <span id="favorites-icon"
            ><img src="assets/hollow-heart.png" alt="Add to favourites icon"
          /></span>
          <span id="toast-favorite"></span>
        </header>
        <h2 id="timeToVisit"></h2>
        <div id="loading-itinerary"></div>
        <section id="placesList"></section>
      </section>
    </main>

    <script src="main.js" defer></script>
    <script src="explore.js" defer></script>
    <script src="featuredDestinations.js" defer></script>
  </body>
</html>
